<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..800&amp;family=Lora:ital,wght@0,400..600;1,400..600&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ece7db; color: #1f1a14; font-family: 'Nunito', ui-sans-serif, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #57a143; text-decoration: none; }
  a:hover { color: #46852f; }
  ::selection { background: #afd274; color: #1f1a14; }
  input::placeholder { color: #a0937f; }
  @media (min-width: 760px) {
    [data-shell] { padding: 26px 0 34px; }
    [data-app] { border-radius: 30px; box-shadow: 0 24px 60px rgba(31,26,20,0.16); border: 1px solid #ded6c6; height: calc(100svh - 60px) !important; }
  }
  @media (min-width: 1180px) {
    [data-app] { max-width: 1060px; }
    [data-tabs] { display: none !important; }
    [data-search] { padding: 26px 40px 18px !important; }
    [data-results] { padding: 0 40px 40px !important; }

  }
</style>
</helmet>

<div data-shell="" style="min-height: 100svh; background: #ece7db;">
  <div data-app="" style="position: relative; overflow: hidden; max-width: 480px; margin: 0 auto; height: 100svh; background: #fdfbf6; display: flex; flex-direction: column;">

    <header style="position: relative; z-index: 10; flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(253,251,246,0.94); backdrop-filter: blur(10px); border-bottom: 1px solid #e7dfcd;">
      <a href="./Gateway_Firesoul Community.dc.html" aria-label="Back to Firesoul Community" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex: none; color: #1f1a14;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"></path></svg>
      </a>
      <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em; color: #1f1a14; margin-right: auto;">Firesoul Directory</span>
      <div style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #57a143; color: #fdfbf6; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;">AW</div>
    </header>

    <div data-search="" id="top" style="flex: none; padding: 18px 18px 14px; background: #f5f1e8; border-bottom: 1px solid #eae3d3;">
      <div style="position: relative; display: flex; align-items: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8a7b68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 15px; pointer-events: none;"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
        <input value="{{ query }}" onChange="{{ onQuery }}" type="search" placeholder="Search by name, place, or city" aria-label="Search the Firesoul Directory" style="width: 100%; padding: 14px 16px 14px 44px; border-radius: 999px; border: 1px solid #e2dac8; background: #fdfbf6; font-family: inherit; font-size: 16px; color: #1f1a14; outline: none;" style-focus="border-color:#96c43d;">
      </div>
      <div style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 0 2px;">
        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
          <button onClick="{{ f.onClick }}" style="flex: none; padding: 8px 15px; border-radius: 999px; border: 1px solid {{ f.border }}; background: {{ f.bg }}; color: {{ f.fg }}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap;">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>

    <div data-results="" style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 24px;">
      <div style="padding: 16px 4px 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #8a7b68;">{{ countLabel }}</div>
      <div data-list="">
        <sc-for list="{{ results }}" as="p" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 16px; padding: 18px 4px; border-top: 1px solid #eae3d3;">
            <button onClick="{{ p.onFlip }}" aria-label="{{ p.flipLabel }}" style="flex: none; width: 84px; height: 84px; padding: 0; border: none; background: transparent; cursor: pointer; perspective: 700px;">
              <span style="position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 520ms cubic-bezier(0.22,1,0.36,1); transform: {{ p.flipTransform }};">
                <span style="position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; background-color: #ede5dd; background-image: url({{ p.headshot }}); background-size: cover; background-position: center;"></span>
                <span style="position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; transform: rotateY(180deg); background-color: #ede5dd; background-image: url({{ p.photo }}); background-size: cover; background-position: center;"></span>
              </span>
            </button>
            <a href="./Gateway_Firesoul Profile.dc.html" style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;">
              <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
                <span style="font-size: 20px; font-weight: 800; line-height: 1.2; color: #1f1a14;">{{ p.name }}</span>
                <span style="font-size: 15px; line-height: 1.5; color: #6b6053;">{{ p.place }}</span>
                <span style="font-size: 14px; color: #9d877a;">{{ p.city }} · {{ p.focus }}</span>
              </span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b0a291" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-left: auto;"><path d="m9 6 6 6-6 6"></path></svg>
            </a>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 40px 8px; text-align: center;">
          <p style="font-size: 16px; line-height: 1.6; color: #6b6053; margin: 0;">No Firesouls match that search yet. Try a different name, place, or city.</p>
        </div>
      </sc-if>
    </div>

    <nav data-tabs="" style="position: relative; z-index: 10; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 8px 6px 10px; background: rgba(253,251,246,0.96); backdrop-filter: blur(10px); border-top: 1px solid #e7dfcd;">
      <a href="./Gateway_Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; color: #8a7b68;" style-hover="color:#57a143;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"></path><path d="M6 10v10h12V10"></path></svg>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.03em;">Gateway</span>
      </a>
      <a href="./Gateway_Firesoul Community.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; color: #57a143;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 19a4 4 0 0 0-8 0"></path><circle cx="12" cy="10" r="3.2"></circle><path d="M4.5 19a3.5 3.5 0 0 1 2.5-3.4M19.5 19a3.5 3.5 0 0 0-2.5-3.4"></path></svg>
        <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.03em;">Community</span>
      </a>
      <a href="./Gateway_Bench Care.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; color: #8a7b68;" style-hover="color:#57a143;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path><path d="M4 18.5V5.5"></path></svg>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.03em;">Resources</span>
      </a>
      <a href="#top" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 12px; color: #8a7b68;" style-hover="color:#57a143;">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5 20c0-3.4 3.1-5.5 7-5.5s7 2.1 7 5.5"></path></svg>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.03em;">Profile</span>
      </a>
    </nav>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}">
const FIRESOULS = [
  { name: 'Todd Marcus', place: 'Strength to Love II', city: 'Baltimore, MD', focus: 'Programming', region: 'Baltimore', photo: './assets/sm/support-gathering.jpg' },
  { name: 'Renee Bowman', place: 'Kirby Lane Park', city: 'Baltimore, MD', focus: 'Community events', region: 'Baltimore', photo: './assets/sm/plaza-bench.jpg' },
  { name: 'Aaron Dickerson', place: 'Bliss Meadows', city: 'Baltimore, MD', focus: 'Youth &amp; education', region: 'Baltimore', photo: './assets/sm/labyrinth.jpg' },
  { name: 'Marcia Hall', place: 'Amazing Grace Garden', city: 'Baltimore, MD', focus: 'Faith communities', region: 'Baltimore', photo: './assets/sm/bench-hero.jpg' },
  { name: 'Dee Whitlock', place: 'Anacostia Gateway', city: 'Washington, DC', focus: 'Programming', region: 'Mid-Atlantic', photo: './assets/sm/firesoul-street.jpg' },
  { name: 'James Okoye', place: 'Riverside Healing Garden', city: 'Richmond, VA', focus: 'Healthcare settings', region: 'Mid-Atlantic', photo: './assets/sm/hospital-yoga.jpg' },
  { name: 'Sandra Pell', place: 'Rocky Gap Reflection Grove', city: 'Cumberland, MD', focus: 'Corrections', region: 'Mid-Atlantic', photo: './assets/sm/bench-sunset-pond.jpg' },
  { name: 'Elena Vasquez', place: 'Cedar Creek Sanctuary', city: 'Durham, NC', focus: 'Youth &amp; education', region: 'Southeast', photo: './assets/sm/family-journal-tour.jpg' },
  { name: 'Marcus Bell', place: 'Fifth Ward Green', city: 'Houston, TX', focus: 'Community events', region: 'South', photo: './assets/sm/bench-girl-balloon.jpg' },
  { name: 'Priya Raman', place: 'Lakeside Respite', city: 'Chicago, IL', focus: 'Healthcare settings', region: 'Midwest', photo: './assets/sm/journals-clothesline.jpg' },
];
const FILTERS = ['All', 'Baltimore', 'Mid-Atlantic', 'Southeast', 'South', 'Midwest'];

class Component extends DCLogic {
  state = { query: '', filter: 'All', flipped: {} };
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const f = this.state.filter;
    const results = FIRESOULS.filter(p => {
      const inRegion = f === 'All' || p.region === f;
      const hit = !q || (p.name + ' ' + p.place + ' ' + p.city + ' ' + p.focus).toLowerCase().indexOf(q) !== -1;
      return inRegion && hit;
    }).map(p => {
      const on = !!this.state.flipped[p.name];
      return Object.assign({}, p, {
        initials: p.name.split(' ').map(w => w[0]).join(''),
        photo: p.photo || './assets/sm/plaza-bench.jpg',
        headshot: p.headshot || './assets/sm/firesoul-street.jpg',
        focus: p.focus.replace('&amp;', '&'),
        flipTransform: on ? 'rotateY(180deg)' : 'rotateY(0deg)',
        flipLabel: on ? 'Show ' + p.name + "'s photo" : 'Show ' + p.place,
        onFlip: () => this.setState(s => ({ flipped: Object.assign({}, s.flipped, { [p.name]: !s.flipped[p.name] }) })),
      });
    });
    return {
      query: this.state.query,
      onQuery: e => this.setState({ query: e.target.value }),
      filters: FILTERS.map(label => ({
        label,
        onClick: () => this.setState({ filter: label }),
        bg: this.state.filter === label ? '#57a143' : '#fdfbf6',
        fg: this.state.filter === label ? '#fdfbf6' : '#4a4137',
        border: this.state.filter === label ? '#57a143' : '#e2dac8',
      })),
      results,
      empty: results.length === 0,
      countLabel: results.length === 1 ? '1 Firesoul' : results.length + ' Firesouls',
    };
  }
}

</script>
</body>
</html>
