<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="ext-resource-dependency" content="./assets/w/bench-three-women-journals.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..900;1,400..800&amp;family=Lora:ital,wght@0,400..600;1,400..600&amp;display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #ece7db; color: #1f1a14; font-family: 'Nunito', ui-sans-serif, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #57a143; text-decoration: none; }
  a:hover { color: #46852f; }
  ::selection { background: #afd274; color: #1f1a14; }
  image-slot { --is-empty-bg: #ede5dd; }
  @keyframes g-fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes g-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes g-drawer { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
  @media (min-width: 760px) {
    [data-shell] { padding: 26px 0 34px; }
    [data-app] { border-radius: 30px; box-shadow: 0 24px 60px rgba(31,26,20,0.16); border: 1px solid #ded6c6; min-height: calc(100svh - 60px); }
    [data-hero] { min-height: 640px; }
  }
  @media (prefers-reduced-motion: reduce) { [data-hero] *, [data-drawer] { animation: none !important; } }
</style>
</helmet>

<div data-shell="" style="min-height: 100svh; background: #ece7db;">
  <div data-app="" style="position: relative; overflow: hidden; max-width: 480px; margin: 0 auto; min-height: 100svh; background: #fdfbf6; display: flex; flex-direction: column;">

    <header style="position: relative; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: #fdfbf6; border-bottom: 1px solid #e7dfcd;">
      <button onClick="{{ toggleMenu }}" aria-label="Open menu" style="display: flex; flex-direction: column; justify-content: center; gap: 5px; width: 44px; height: 44px; padding: 0 7px; background: transparent; border: none; cursor: pointer; flex: none;">
        <span style="height: 2.5px; border-radius: 2px; background: #1f1a14;"></span>
        <span style="height: 2.5px; border-radius: 2px; background: #1f1a14;"></span>
        <span style="height: 2.5px; border-radius: 2px; background: #1f1a14;"></span>
      </button>
      <a href="#top" style="display: flex; align-items: center; margin: 0 auto;">
        <img src="./assets/logo-30-horizontal.png" alt="Nature Sacred — 30 years, 1996–2026" style="height: 58px; width: auto; display: block;">
      </a>
      <button aria-label="Notifications" style="position: relative; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: transparent; border: none; cursor: pointer; flex: none;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3d352a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        <span style="position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #ff4800; border: 2px solid #fdfbf6; opacity: {{ dotOpacity }};"></span>
      </button>
      <div style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #57a143; color: #fdfbf6; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; letter-spacing: 0.02em;">{{ initials }}</div>
    </header>

    <section id="top" data-hero="" style="position: relative; flex: 1; min-height: 560px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">
      <image-slot id="gateway-hero" shape="rect" fit="cover" src="./assets/w/bench-three-women-journals.jpeg" style="position: absolute; inset: 0; width: 100%; height: 100%;" placeholder="Drop the welcome photo — a Firesoul on the bench"></image-slot>
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(31,26,20,0.78) 0%, rgba(31,26,20,0.52) 40%, rgba(31,26,20,0.4) 58%, rgba(31,26,20,0.08) 80%, rgba(31,26,20,0) 100%);"></div>

      <div style="position: relative; z-index: 2; padding: 40px 24px 34px; display: flex; flex-direction: column; align-items: flex-start; gap: 0;">
        <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(253,251,246,0.92); animation: g-fade-up 900ms cubic-bezier(0.22,1,0.36,1) both;">Firesoul Gateway</div>

        <h1 style="font-family: 'Lora', Georgia, serif; font-size: clamp(38px, 11vw, 50px); font-weight: 600; line-height: 1.04; letter-spacing: -0.02em; color: #fff; margin: 14px 0 0; max-width: 14ch; text-shadow: 0 2px 24px rgba(31,26,20,0.45); animation: g-fade-up 900ms cubic-bezier(0.22,1,0.36,1) 140ms both;">{{ greeting }}<br>{{ firstName }}.</h1>

        <sc-if value="{{ showLatest }}" hint-placeholder-val="{{ true }}">
          <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; animation: g-fade-up 900ms cubic-bezier(0.22,1,0.36,1) 300ms both;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#afd274" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M20 4C10 4 5 9 5 15a5 5 0 0 0 5 5c6 0 11-6 11-16z"></path><path d="M9 19c1.6-5 4.6-8 9-10"></path></svg>
              <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(253,251,246,0.92);">Latest</span>
            </div>
            <div style="font-size: 19px; font-weight: 700; color: #fff; text-shadow: 0 1px 14px rgba(31,26,20,0.5);">Flash Funding — Monday, April 20</div>
            <a href="#top" style="font-size: 15px; font-weight: 600; color: rgba(253,251,246,0.9); border-bottom: 1px solid rgba(253,251,246,0.5); padding-bottom: 2px; display: inline-flex; align-items: center; gap: 7px;" style-hover="color:#fff; border-bottom-color:#fff;">See details<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a>
          </div>
        </sc-if>

        <a href="./Gateway_Home.dc.html" style="margin-top: 34px; display: inline-flex; align-items: center; gap: 14px; padding: 13px 16px 13px 20px; border-radius: 999px; border: 1px solid rgba(253,251,246,0.55); background: rgba(31,26,20,0.4); backdrop-filter: blur(8px); color: #fff; font-size: 17px; font-weight: 700; transition: background 280ms cubic-bezier(0.22,1,0.36,1), transform 280ms cubic-bezier(0.22,1,0.36,1); animation: g-fade-up 900ms cubic-bezier(0.22,1,0.36,1) 460ms both;" style-hover="background:rgba(87,161,67,0.72); color:#fff; transform:translateY(-1px);">
          <img src="./assets/bench-icon-sm.png" alt="" aria-hidden="true" style="width: 26px; height: auto; display: block; flex: none; filter: brightness(1.55) saturate(0.55) drop-shadow(0 1px 4px rgba(31,26,20,0.45));">
          Enter Gateway
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; opacity: 0.9;"><path d="m9 6 6 6-6 6"></path></svg>
        </a>
      </div>
    </section>

    <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: #fdfbf6; animation: g-fade 200ms ease both;">
        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid #e7dfcd;">
          <button onClick="{{ toggleMenu }}" aria-label="Close menu" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; background: transparent; border: none; cursor: pointer; flex: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1f1a14" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
          </button>
          <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: #8a7b68;">Gateway menu</span>
        </div>
        <nav data-drawer="" style="display: flex; flex-direction: column; padding: 12px 10px 28px; animation: g-drawer 280ms cubic-bezier(0.22,1,0.36,1) both;">
          <a href="#top" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 14px; border-radius: 12px; font-size: 20px; font-weight: 700; color: #1f1a14;" style-hover="background:#f3efe3;">My Sacred Place<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9d877a;">Kirby Lane</span></a>
          <a href="#top" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 14px; border-radius: 12px; font-size: 20px; font-weight: 700; color: #1f1a14;" style-hover="background:#f3efe3;">Journal Entries<span style="min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: #f5d06a; color: #1f1a14; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;">6</span></a>
          <a href="#top" style="display: flex; align-items: center; padding: 16px 14px; border-radius: 12px; font-size: 20px; font-weight: 700; color: #1f1a14;" style-hover="background:#f3efe3;">The Network</a>
          <a href="#top" style="display: flex; align-items: center; padding: 16px 14px; border-radius: 12px; font-size: 20px; font-weight: 700; color: #1f1a14;" style-hover="background:#f3efe3;">Funding &amp; Grants</a>
          <a href="#top" style="display: flex; align-items: center; padding: 16px 14px; border-radius: 12px; font-size: 20px; font-weight: 700; color: #1f1a14;" style-hover="background:#f3efe3;">Toolkits &amp; Resources</a>
          <a href="#top" style="display: flex; align-items: center; padding: 16px 14px; border-radius: 12px; font-size: 20px; font-weight: 700; color: #1f1a14;" style-hover="background:#f3efe3;">Gatherings</a>
          <div style="height: 1px; background: #e7dfcd; margin: 14px 14px;"></div>
          <a href="./final_Homepage.dc.html" style="display: flex; align-items: center; gap: 9px; padding: 12px 14px; font-size: 15px; font-weight: 600; color: #57a143;">naturesacred.org<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M9 7h8v8"></path></svg></a>
        </nav>
      </div>
    </sc-if>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;firesoulName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Angela Walseng&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;greetingMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Auto&quot;,&quot;Morning&quot;,&quot;Afternoon&quot;,&quot;Evening&quot;],&quot;default&quot;:&quot;Auto&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showLatest&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showNotificationDot&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const name = (this.props.firesoulName ?? 'Angela').trim();
    const mode = this.props.greetingMode ?? 'Auto';
    let part = mode;
    if (mode === 'Auto') {
      const h = new Date().getHours();
      part = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
    }
    const initials = name.split(/\s+/).filter(Boolean).map(w => w[0].toUpperCase()).slice(0, 2).join('') || 'AW';
    return {
      greeting: 'Good ' + part.toLowerCase() + ',',
      firstName: name.split(/\s+/)[0] || 'Angela',
      initials: initials.length === 1 ? initials + 'W' : initials,
      showLatest: this.props.showLatest ?? true,
      dotOpacity: (this.props.showNotificationDot ?? true) ? 1 : 0,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}

</script>
</body>
</html>
